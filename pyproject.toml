[project]
name = "wahoo-fitness-homeassistant"
version = "0.0.0"
description = "Read-only Wahoo fitness metrics for Home Assistant via WFTNP."
requires-python = ">=3.14.2"
dependencies = ["wftnp==0.1.2"]

[dependency-groups]
dev = ["homeassistant==2026.9.4", "pytest-homeassistant-custom-component==0.13.367", "pytest-cov>=6", "ruff>=0.13", "ty>=0.0.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["hardware: opt-in serial read-only tests against real equipment"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"]

[tool.coverage.run]
branch = true
source = ["custom_components/wahoo_fitness"]
